<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="theme-color" content="#F5EFE3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="format-detection" content="telephone=no"><style>html{color-scheme:light}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;background:#F5EFE3;color:#241C14}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<meta charset="utf-8">
<title>意大利随身手册</title>

<style>
/* ============ tokens ============ */
:root{
  --bg:#F5EFE3;
  --surface:#FFFBF4;
  --surface2:#EFE6D6;
  --sunken:#EBE1CE;
  --ink:#241C14;
  --ink2:#6A5A47;
  --ink3:#9B8970;
  --line:#E3D8C4;
  --line2:#CFC0A5;
  --terra:#B04A22;
  --terra-deep:#8E3A19;
  --terra-soft:#F8E4D9;
  --olive:#5B6C33;
  --olive-soft:#E7EDD6;
  --slate:#3F5F6E;
  --slate-soft:#E0EAEE;
  --ochre:#94670F;
  --ochre-soft:#F8E9C9;
  --shadow-1:0 1px 1px rgba(70,45,20,.05), 0 6px 16px -12px rgba(70,45,20,.35);
  --shadow-2:0 2px 4px rgba(70,45,20,.07), 0 14px 30px -18px rgba(70,45,20,.5);
  --r:14px;
  --r-sm:9px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Songti SC",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}

/* ============ base ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.55;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--slate);text-decoration:none}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}

#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
#view{padding:0 14px calc(86px + env(safe-area-inset-bottom,0px));}

/* ============ sticky head ============ */
.head{
  position:sticky;top:0;z-index:30;
  margin:0 -14px;padding:10px 14px 0;
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
.head-row{display:flex;align-items:baseline;gap:8px;min-height:26px}
.head-title{font-size:17px;font-weight:700;letter-spacing:.01em}
.head-sub{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.sync{margin-left:auto;font-size:11.5px;color:var(--ink3);white-space:nowrap;display:flex;align-items:center;gap:4px}
.sync .dot{width:6px;height:6px;border-radius:50%;background:var(--ink3);display:inline-block}
.sync.on .dot{background:var(--olive)}

/* day pills */
.strip{display:flex;gap:6px;overflow-x:auto;padding:9px 0 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.pill{
  flex:0 0 auto;scroll-snap-align:center;
  min-width:52px;min-height:46px;padding:5px 9px;
  border:1px solid var(--line);border-radius:11px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:var(--ink2);
}
.pill b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.pill span{font-size:10.5px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pill.sel{background:var(--terra);border-color:var(--terra);color:#FFF3EA}
.pill.sel b{color:#fff}
.pill.today::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--terra);position:absolute}
.pill.today{position:relative}
.pill.today::after{bottom:3px}
.pill.sel.today::after{background:#fff}
.pill.full{border-color:var(--olive);}
.pill.sel.full{border-color:var(--terra)}

/* ============ banner ============ */
.banner{
  margin:12px 0 0;padding:13px 14px;border-radius:var(--r);
  background:var(--terra-soft);border:1px solid var(--line);
  display:flex;gap:11px;align-items:center;
}
.banner .bnum{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--terra-deep);line-height:1;font-variant-numeric:tabular-nums}
.banner .btxt{font-size:14px;color:var(--ink);line-height:1.45}
.banner button{margin-left:auto;flex:0 0 auto;min-height:44px;padding:0 13px;border-radius:10px;background:var(--terra);color:#fff;font-size:14px;font-weight:600}

/* ============ next card ============ */
.next{
  margin-top:12px;padding:15px 15px 13px;border-radius:18px;
  background:var(--surface);border:1px solid var(--line2);
  box-shadow:var(--shadow-2);
}
.next.anim{animation:slideup .32s cubic-bezier(.2,.7,.3,1)}
@keyframes slideup{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.next.anim{animation:none}}
.eyebrow{
  font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--terra);font-weight:700;display:flex;align-items:center;gap:7px;
}
.eyebrow .rest{color:var(--ink3);font-weight:500;letter-spacing:.06em}
.next .big{display:flex;gap:11px;align-items:flex-start;margin-top:9px}
.next .bige{font-size:30px;line-height:1.1;flex:0 0 auto}
.next .biga{font-size:22px;font-weight:700;line-height:1.3;text-wrap:balance}
.next .bigmeta{margin-top:5px;font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.next .bigit{font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--ink2)}
.next .bigsub{margin-top:9px;font-size:15px;color:var(--ink2);line-height:1.5}
.next .acts{display:flex;gap:8px;margin-top:14px}
.btn{
  min-height:46px;padding:0 16px;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:16px;font-weight:600;border:1px solid transparent;
}
.btn.primary{background:var(--terra);color:#fff;flex:1}
.btn.ghost{background:var(--surface2);color:var(--ink);border-color:var(--line)}
.next.done-all{background:var(--olive-soft);border-color:var(--olive)}
.next.done-all .eyebrow{color:var(--olive)}

/* ============ progress ============ */
.prog{display:flex;align-items:center;gap:9px;margin:16px 0 8px}
.prog .lbl{font-size:12.5px;color:var(--ink3);letter-spacing:.06em;white-space:nowrap}
.prog .bar{flex:1;height:4px;border-radius:2px;background:var(--sunken);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--olive);border-radius:2px;transition:width .3s ease}
@media (prefers-reduced-motion:reduce){.prog .bar i{transition:none}}

/* ============ section titles ============ */
.sect{margin:20px 0 9px;display:flex;align-items:baseline;gap:8px}
.sect h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.sect .rule{flex:1;height:1px;background:var(--line)}

/* ============ steps ============ */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{
  display:flex;gap:10px;padding:11px 12px 11px 8px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  position:relative;
}
.step.is-done{background:var(--olive-soft);border-color:var(--olive-soft)}
.step.is-skip{opacity:.55}
.check{
  flex:0 0 auto;width:44px;height:44px;margin:-4px 0 0 -2px;
  display:flex;align-items:center;justify-content:center;
}
.check .box{
  width:23px;height:23px;border-radius:7px;border:2px solid var(--line2);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:14px;line-height:1;color:transparent;font-weight:700;
}
.step.is-done .check .box{background:var(--olive);border-color:var(--olive);color:#fff}
.step.is-skip .check .box{border-style:dashed}
.step.is-skip .check .box::after{content:"–";color:var(--ink3)}
.sbody{flex:1;min-width:0}
.l1{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.t{font-family:var(--mono);font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.t:empty{display:none}
.a{font-size:17px;font-weight:600;line-height:1.4;flex:1 1 auto;min-width:0}
.step.is-done .a{text-decoration:line-through;text-decoration-color:var(--olive);text-decoration-thickness:1.5px;color:var(--ink2)}
.it{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink3);letter-spacing:.01em;margin-top:1px}
.sub{font-size:14.5px;color:var(--ink2);margin-top:5px;line-height:1.5}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:12px;padding:2px 7px;border-radius:6px;letter-spacing:.02em;white-space:nowrap}
.tag.hard{background:var(--ochre-soft);color:var(--ochre);font-weight:700}
.tag.opt{background:var(--slate-soft);color:var(--slate)}
.tag.tick{background:var(--terra-soft);color:var(--terra-deep)}

/* link chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{
  min-height:34px;padding:0 11px;border-radius:9px;
  display:inline-flex;align-items:center;gap:4px;
  font-size:13.5px;font-weight:600;
  background:var(--slate-soft);color:var(--slate);border:1px solid transparent;
}
.chip.skip{background:var(--surface2);color:var(--ink2);border-color:var(--line)}
.chip.copy{background:var(--surface2);color:var(--ink2);border-color:var(--line)}
.stayaddr{margin-top:8px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.stops .stopbtns{display:flex;gap:5px;flex:0 0 auto}
.stops .stopbtns .chip{min-height:30px;padding:0 9px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);max-width:86%;padding:9px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:13.5px;line-height:1.4;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.act{pointer-events:auto}
#toast .undo{margin-left:10px;padding:3px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;font-size:12.5px;font-weight:700;font-family:inherit}
.li-flash{animation:liflash 1.4s ease-out}
@keyframes liflash{0%{background:var(--terra-soft)}100%{background:transparent}}
#cele{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(35,32,28,.55);opacity:0;pointer-events:none;transition:opacity .25s}
#cele.show{opacity:1;pointer-events:auto}
#cele .box{background:var(--bg);color:var(--ink);border-radius:18px;padding:26px 22px 20px;max-width:320px;width:86%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.28);animation:celepop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes celepop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#cele .ce{font-size:54px;line-height:1;margin-bottom:10px;display:block;animation:celebounce 1.3s ease-in-out infinite}
@keyframes celebounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#cele .ct{font-size:20px;font-weight:800;margin-bottom:6px}
#cele .cs{font-size:14px;line-height:1.55;opacity:.8;margin-bottom:16px}
#cele .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.confetti{position:fixed;top:-40px;font-size:22px;z-index:81;pointer-events:none;animation:confall linear forwards}
@keyframes confall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(360deg)}}

/* details */
.det{margin-top:9px}
.det>summary{
  list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  min-height:32px;font-size:13.5px;color:var(--ink3);font-weight:600;letter-spacing:.03em;
}
.det>summary::-webkit-details-marker{display:none}
.det>summary::after{content:"▾";font-size:11px;transition:transform .18s}
.det[open]>summary::after{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.det>summary::after{transition:none}}
.detbody{
  margin-top:6px;padding:11px 12px;border-radius:var(--r-sm);
  background:var(--surface2);border:1px solid var(--line);
  font-size:14.5px;line-height:1.55;
}
.dl{display:flex;gap:8px;margin-bottom:8px}
.dl:last-child{margin-bottom:0}
.dl .k{flex:0 0 auto;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--ink3);padding-top:3px;width:44px}
.dl .v{flex:1;min-width:0;color:var(--ink)}
.dl .v ul{margin:0;padding-left:17px}
.dl .v li{margin:1px 0}
.ph{color:var(--ink3);font-style:normal}

/* meal cards */
.meals{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.meal{
  padding:10px 11px;border-radius:var(--r-sm);
  background:var(--surface2);border:1px solid var(--line);
  border-left:3px solid var(--terra);
}
.meal .mn{font-size:15.5px;font-weight:700;letter-spacing:.01em}
.meal .mg{
  font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ochre);
  letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:6px;
}
.meal .md{font-size:14px;color:var(--ink2);margin-top:2px}
.meal .mh{font-size:13px;color:var(--slate);margin-top:3px;font-variant-numeric:tabular-nums;line-height:1.45}
.meal .mw{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.45}
.meal .mb{font-size:13px;color:var(--ink3);margin-top:3px;line-height:1.5}
.meal .mb a.tel{
  font-family:var(--mono);font-weight:700;color:var(--terra-deep);
  letter-spacing:.01em;white-space:nowrap;border-bottom:1px solid var(--line2);
}
.meal .chips{margin-top:8px}

/* ============ route rail ============ */
.rail{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px 14px;
}
.rail .rbtn{
  width:100%;min-height:44px;border-radius:11px;background:var(--slate-soft);color:var(--slate);
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:700;margin-bottom:13px;
}
.rlh{margin:16px 0 10px;font-size:14px;font-weight:600;color:var(--ink2)}
.rl{list-style:none;margin:0;padding:0}
.rl li{display:flex;gap:11px;align-items:flex-start}
.rl .gut{flex:0 0 auto;width:11px;display:flex;flex-direction:column;align-items:center;align-self:stretch}
.rl .pt{width:9px;height:9px;border-radius:50%;border:2px solid var(--terra);background:var(--surface);margin-top:6px;flex:0 0 auto}
.rl li:first-child .pt,.rl li:last-child .pt{background:var(--terra)}
.rl .ln{flex:1;width:0;border-left:2px dotted var(--line2);margin:3px 0 0}
.rl .rc{flex:1;min-width:0;padding-bottom:14px}
.rl li:last-child .rc{padding-bottom:0}
.rl .rn{font-size:15.5px;font-weight:600;line-height:1.35}
.rl .ri{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink3)}
.rl .rleg{
  margin-top:6px;font-size:12.5px;color:var(--ink2);
  background:var(--sunken);display:inline-block;padding:2px 8px;border-radius:6px;
  font-variant-numeric:tabular-nums;
}

/* ---- 手绘示意小地图 ---- */
.mini{
  display:block;width:100%;height:auto;
  background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-sm);
  font-family:var(--sans);
}
.mini a{cursor:pointer}
.mini .hit{fill:#000;fill-opacity:0}
.mini .wv{fill:none;stroke:var(--slate);stroke-width:2.2;stroke-linecap:round;opacity:.55}
.mini .gl{fill:none;stroke:var(--ink3);stroke-width:.7;stroke-linecap:round;opacity:.35}
.mini .rg{fill:none;stroke:var(--ink3);stroke-width:1;stroke-linejoin:round;stroke-linecap:round;opacity:.55}
.mini .lw{fill:none;stroke:var(--terra);stroke-width:.9;stroke-dasharray:2.2 2;stroke-linecap:round;opacity:.9}
.mini .ls{fill:none;stroke:var(--ochre);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.mini .dv{fill:none;stroke:var(--line2);stroke-width:.6;stroke-dasharray:1.6 1.6}
.mini .pd{fill:var(--terra);stroke:var(--sunken);stroke-width:.7}
.mini .pd.s{fill:var(--surface);stroke:var(--terra);stroke-width:1.1}
.mini .pd.g{fill:var(--ink3);stroke:var(--sunken)}
.mini text{paint-order:stroke;stroke:var(--sunken);stroke-width:1.7px;stroke-linejoin:round;stroke-linecap:round}
.mini .pl{fill:var(--ink);font-size:3.6px;font-weight:600}
.mini .pl.g{fill:var(--ink3);font-weight:500}
.mini .lt{fill:var(--ink2);font-size:3.5px}
.mini .wt{fill:var(--slate);font-size:3.5px}
.mini .dvt{fill:var(--ink3);font-size:3.5px;font-weight:700}
.mini .pn{fill:var(--surface);font-size:3.5px;font-weight:700;text-anchor:middle;font-family:var(--mono);stroke:none}
.mini .pe{font-size:6px;stroke:none;text-anchor:middle}
.maplg{display:flex;flex-wrap:wrap;align-items:center;gap:3px 12px;font-size:11.5px;color:var(--ink3);margin-bottom:8px}
.maplg i{display:inline-block;width:15px;height:0;vertical-align:middle;margin-right:4px;border-top:2px dashed var(--terra)}
.maplg i.d{border-top:2px solid var(--ochre)}
.maplg i.r{border-top:3px solid var(--slate);opacity:.55}
.mapcap{margin-top:8px;font-size:11.5px;color:var(--ink3);letter-spacing:.02em}

/* ============ callouts ============ */
.call{
  margin-top:9px;padding:12px 13px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ochre);
  font-size:14.5px;line-height:1.55;color:var(--ink2);
}
.call b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ochre);margin-bottom:4px;font-weight:700}
.call.stay{border-left-color:var(--olive)}
.call.stay b{color:var(--olive)}
.call .kk{color:var(--ink);font-weight:600}

/* wc */
.wc{margin-top:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px 13px}
.wc>summary{
  list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;
  font-size:14.5px;font-weight:600;color:var(--ink2);
}
.wc>summary::-webkit-details-marker{display:none}
.wc>summary::after{content:"▾";margin-left:auto;font-size:11px;color:var(--ink3)}
.wc[open]>summary::after{content:"▴"}
.wcb{padding:0 0 12px;font-size:14.5px;line-height:1.6;color:var(--ink2)}
.wcb .code{font-family:var(--mono);font-weight:700;color:var(--terra-deep);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.wcb .grp{margin-bottom:7px}
.wcb .grp:last-child{margin-bottom:0}
.wcb .gh{font-size:12px;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase;font-weight:700}

/* ============ overview ============ */
.flight{
  background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);
  padding:14px;box-shadow:var(--shadow-1);
}
.fl{display:flex;flex-direction:column;gap:3px;padding:9px 0}
.fl+.fl{border-top:1px dashed var(--line)}
.fl .fh{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.fl .fno{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.03em}
.fl .fd{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.fl .fr{display:flex;align-items:center;gap:8px;font-size:15px;margin-top:2px;flex-wrap:wrap}
.fl .fr .tm{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.fl .fr .ar{color:var(--terra)}
.fl .fx{font-size:13px;color:var(--ink2);margin-top:2px}
.fl .fx .pnr{font-family:var(--mono);font-weight:700;letter-spacing:.06em;color:var(--ink)}
.fnote{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink2)}

.dcards{display:flex;flex-direction:column;gap:8px}
.dcard{
  width:100%;text-align:left;display:flex;gap:11px;padding:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
}

function loadLocal(){

function saveLocal(){

function clean(o){
  var out = {};
  if(!o) return out;
  Object.keys(o).forEach(function(k){
    var v = o[k];
    if(v === "done" || v === "skipped") out[k] = v;
  });
  return out;
}

function setStep(id, val){
  if(val){ STATE[id] = val; } else { delete STATE[id]; }
  saveLocal();
  refreshMarks();
  if(SB_URL){ PENDING[id] = val || null; savePending(); sbPush(0); }
  if(dbRef){
    var patch = {}; patch[id] = val || null;
    dbRef.update(patch)["catch"](function(err){
      var code = err && err.code;
      if(code === "invalid_argument" || code === "transform_error"){
        // 文档还不存在 —— 建档
        dbRef.set(clean(STATE))["catch"](function(){ setSync(false); });
      }else if(code === "revoked" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed"){
        dbRef = null; setSync(false);
      }
    });
  }
}

function setSync(on){
  dbLive = !!on;
  var el = document.getElementById("sync");

}

function initDb(){
  try{
    if(!window.claude || typeof window.claude.use !== "function") return;
    window.claude.use("db").then(function(db){
      if(!db) return;
      var ref = db.doc("progress/trip");
      dbRef = ref;
      ref.onSnapshot(function(snap){
        if(snap.exists){
          STATE = clean(snap.data());
          saveLocal();
          refreshMarks();
        }
        setSync(true);
      }, function(){
        dbRef = null; setSync(false);
      });
    })["catch"](function(){});
  }catch(e){}
}

  return out;

function sbPull(cb){
  if(!window.fetch){ if(cb) cb(false); return; }
  fetch(SB_URL + "/rest/v1/progress?id=eq." + SB_ROW + "&select=state,updated_at", { headers: sbHeaders(false), cache: "no-store" })

  var url = SB_URL + "/rest/v1/progress?id=eq." + SB_ROW + "&updated_at=eq." + encodeURIComponent(sbSeen);

  if(!el){ el = document.createElement("div"); el.id = "cele"; document.body.appendChild(el); }
  var last = selDay >= DAYS.length - 1;
  var title = last ? "12 天全部走完 🎉" : "今日已完成 🎉";
  var sub = last ? "一路平安回家。这本手册留着，下次还能翻。" : ("休息吧，准备明日的旅途。" + (d.stay ? d.stay.t.split(" · ")[0] + "，晚安。" : ""));
  el.innerHTML = '<div class="box"><span class="ce">' + (last ? "🏠" : "🌙") + '</span><div class="ct">' + esc(title) + '</div><div class="cs">' + esc(sub) + '</div><div class="acts">' +
    (last ? "" : '<button class="btn primary" data-cele-next="1">看明天 →</button>') + '<button class="btn ghost" data-cele-close="1">关闭</button></div></div>';
  el.className = "show";
  var em = ["🎉","✨","🍷","🍝","⛰","🎈","🧀","🚗","🍦","🎫"];
  for(var i = 0; i < 26; i++){
    var c = document.createElement("span"); c.className = "confetti"; c.textContent = em[i % em.length];
    c.style.left = Math.round(Math.random() * 96) + "vw";
    c.style.animationDuration = (2.2 + Math.random() * 1.8) + "s";
    c.style.animationDelay = (Math.random() * 0.9) + "s";
    document.body.appendChild(c);
    (function(node){ setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 5000); })(c);
  }
}
function closeCele(){ var el = document.getElementById("cele"); if(el) el.className = ""; }
function toast(msg){
  var el = document.getElementById("toast");
  if(!el){ el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
  el.textContent = msg; el.className = "show";
  clearTimeout(toast._t); toast._t = setTimeout(function(){ el.className = ""; }, 1600);
}
function copyText(s){
  var done = function(){ toast("已复制：" + s); };
  var fail = function(){ toast("复制失败，长按选中吧"); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(s).then(done, function(){ legacy(); }); return; }
  }catch(e){}
  legacy();
  function legacy(){
    try{
      var ta = document.createElement("textarea"); ta.value = s; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.left = "-9999px";
      document.body.appendChild(ta); ta.select(); var ok = document.execCommand("copy"); document.body.removeChild(ta);
      ok ? done() : fail();
    }catch(e){ fail(); }
  }
}
function romeToday(){
  try{
    return new Intl.DateTimeFormat("en-CA", {timeZone:"Europe/Rome", year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date());
  }catch(e){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
}
function toMs(iso){ var p = iso.split("-"); return Date.UTC(+p[0], +p[1]-1, +p[2]); }
var TODAY = romeToday();
var DAY_MS = 86400000;
var TRIP_START = "2026-10-06", TRIP_END = "2026-10-17";
var daysToStart = Math.round((toMs(TRIP_START) - toMs(TODAY)) / DAY_MS);
var todayIdx = -1;
for(var _i = 0; _i < DAYS.length; _i++){ if(DAYS[_i].date === TODAY) todayIdx = _i; }
var phase = todayIdx >= 0 ? "during" : (toMs(TODAY) < toMs(TRIP_START) ? "before" : "after");

var selDay = todayIdx >= 0 ? todayIdx : (phase === "before" ? 0 : 11);
var tab = "today";

function mdLabel(iso){ var p = iso.split("-"); return (+p[1]) + "/" + (+p[2]); }

/* ==================================================================
   渲染工具
   ================================================================== */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function ext(u, label){
  return '<a class="chip" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">🔗 ' + esc(label) + "</a>";
}
function allIds(){
  var ids = [];
  DAYS.forEach(function(d){ d.steps.forEach(function(s){ ids.push(s.id); }); });
  PREP.forEach(function(g){ g.items.forEach(function(s){ ids.push(s.id); }); });
  PACK.forEach(function(g){ g.items.forEach(function(s){ ids.push(s.id); }); });
  return ids;
}
function dayDone(d){
  var n = 0;
  d.steps.forEach(function(s){ if(STATE[s.id]) n++; });
  return n;
}
function firstOpen(d){
  for(var i = 0; i < d.steps.length; i++){ if(!STATE[d.steps[i].id]) return i; }
  return -1;
}
function grpDone(items){
  var n = 0;
  items.forEach(function(s){ if(STATE[s.id]) n++; });
  return n;
}

/* ---- 一条步骤 ---- */
function stepHtml(s){
  var h = '<li class="step" data-step="' + s.id + '">';
  h += '<button class="check" data-toggle="' + s.id + '" role="checkbox" aria-checked="false" aria-label="完成 ' + esc(s.a) + '"><span class="box">✓</span></button>';
  h += '<div class="sbody">';
  h += '<div class="l1"><span class="t">' + esc(s.t || "") + '</span><span class="a">' + esc(s.e ? s.e + " " : "") + esc(s.a) + "</span></div>";
  if(s.it) h += '<div class="it">' + esc(s.it) + "</div>";

  var tags = "";
  if(s.hard) tags += '<span class="tag hard">⏰ ' + esc(s.hard) + "</span>";
  if(s.optional) tags += '<span class="tag opt">可选</span>';
  if(s.ticket) tags += '<span class="tag tick">📎 电子票待补充</span>';
  if(tags) h += '<div class="tagrow">' + tags + "</div>";

  if(s.sub) h += '<div class="sub">' + esc(s.sub) + "</div>";

  if(s.meals && s.meals.length){
    h += '<div class="meals">';
    s.meals.forEach(function(m){
      h += '<div class="meal"><div class="mn">' + esc(m.n) +
           (m.g ? '<span class="mg">★ ' + esc(m.g) + "</span>" : "") + "</div>";
      if(m.d) h += '<div class="md">🍴 ' + esc(m.d) + "</div>";
      if(m.h) h += '<div class="mh">🕐 ' + esc(m.h) + "</div>";
      if(m.w) h += '<div class="mw">💡 ' + esc(m.w) + "</div>";
      if(m.b || m.tel){
        h += '<div class="mb">📞 ' + esc(m.b || "");
        if(m.tel) h += (m.b ? " " : "") + '<a class="tel" href="tel:' + esc(m.tel.replace(/[^0-9+]/g, "")) + '">' + esc(m.tel) + "</a>";
        h += "</div>";
      }
      if(m.m) h += '<div class="chips"><a class="chip" href="' + esc(findUrl(m.m)) + '" target="_blank" rel="noopener noreferrer">📍 看位置</a>' +
                   '<button class="chip copy" data-copy="' + esc(m.m) + '">📋 地址：' + esc(m.n.replace(/^备选 /, "")) + '</button></div>';
      h += "</div>";
    });
    h += "</div>";
  }

  var chips = "";
  var who = s.who || ((s.meals && s.meals.length) ? s.meals[0].n : (s.it || s.place || (s.nav ? s.nav.m : "")));
  if(s.nav) chips += '<a class="chip" href="' + esc(navUrl(s.nav.m, s.nav.mode)) + '" target="_blank" rel="noopener noreferrer">🧭 导航</a>' +
                     '<button class="chip copy" data-copy="' + esc((s.addr && s.addr.length) ? s.addr.join("；") : s.nav.m) + '">📋 地址：' + esc(who) + '</button>';
  if(s.place) chips += '<a class="chip" href="' + esc(findUrl(s.place)) + '" target="_blank" rel="noopener noreferrer">📍 看位置</a>';
  if(s.video) chips += '<a class="chip" href="' + esc(s.video) + '" target="_blank" rel="noopener noreferrer">📺 讲解</a>';
  if(s.link) chips += ext(s.link.u, s.link.l);
  if(s.optional) chips += '<button class="chip skip" data-skip="' + s.id + '">跳过</button>';
  if(chips) h += '<div class="chips">' + chips + "</div>";

  var det = "";
  if(s.tips && s.tips.length){
    det += '<div class="dl"><div class="k">📺 讲解要点</div><div class="v"><ul>' + s.tips.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div></div>";
  }
  if(s.need && s.need.length){
    det += '<div class="dl"><div class="k">需要</div><div class="v"><ul>' + s.need.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div></div>";
  }
  if(s.addr && s.addr.length){
    det += '<div class="dl"><div class="k">地址</div><div class="v"><ul>' + s.addr.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div></div>";
  }
  if(s.warn && s.warn.length){
    det += '<div class="dl"><div class="k">注意</div><div class="v"><ul>' + s.warn.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div></div>";
  }
  if(s.ticket){
    det += '<div class="dl"><div class="k">电子票</div><div class="v"><span class="ph">📎 待补充（门票图后续传上来）</span></div></div>';
  }
  if(det) h += '<details class="det"><summary>详情</summary><div class="detbody">' + det + "</div></details>";

  h += "</div></li>";
  return h;
}

/* ---- 下一步大卡 ---- */
function nextHtml(){
  var d = DAYS[selDay];
  var i = firstOpen(d);
  if(i < 0){
    return '<div class="next done-all"><div class="eyebrow">D' + d.n + " · " + mdLabel(d.date) + '</div>' +
      '<div class="big"><span class="bige">🍷</span><span class="biga">今天收工</span></div>' +
      '<div class="bigsub">' + d.steps.length + " 步全部走完。" + (d.stay ? esc(d.stay.t.split(" · ")[0]) + "，晚安。" : "路上见。") + "</div></div>";
  }
  var s = d.steps[i];
  var h = '<div class="next"><div class="eyebrow">下一步<span class="rest">D' + d.n + " · 第 " + (i+1) + " / " + d.steps.length + " 步</span></div>";
  h += '<div class="big"><span class="bige">' + esc(s.e || "•") + '</span><span class="biga">' + esc(s.a) + "</span></div>";
  h += '<div class="bigmeta"><span class="num">' + esc(s.t || "") + "</span>";
  if(s.it) h += '<span class="bigit">' + esc(s.it) + "</span>";
  h += "</div>";
  var tags = "";
  if(s.hard) tags += '<span class="tag hard">⏰ ' + esc(s.hard) + "</span>";
  if(s.optional) tags += '<span class="tag opt">可选</span>';
  if(s.ticket) tags += '<span class="tag tick">📎 电子票待补充</span>';
  if(tags) h += '<div class="tagrow">' + tags + "</div>";
  var sub = s.sub || "";
  if(!sub && s.meals && s.meals.length) sub = s.meals.map(function(m){ return m.n + "（" + (m.d || "") + "）"; }).join(" / ");
  if(s.warn && s.warn.length) sub = (sub ? sub + " " : "") + "⚠️ " + s.warn[0];
  if(sub) h += '<div class="bigsub">' + esc(sub) + "</div>";
  h += '<div class="acts"><button class="btn primary" data-toggle="' + s.id + '">✅ 完成</button>';
  if(s.nav) h += '<a class="btn ghost" href="' + esc(navUrl(s.nav.m, s.nav.mode)) + '" target="_blank" rel="noopener noreferrer">🧭 导航</a>';
  if(s.optional) h += '<button class="btn ghost" data-skip="' + s.id + '">跳过</button>';
  h += "</div></div>";
  return h;
}

/* ---- 地图 · 底图 + SVG 叠层（全部内嵌，无外部资源） ---- */
var PIN_FILL = { eat:"#D9642B", sight:"#2F6DB5", stay:"#3B8F5A", transit:"#6B6B6B", shop:"#7A4FB2" };
var PIN_LBL  = { eat:"吃饭", sight:"景点", stay:"住宿", transit:"交通", shop:"买东西" };
var PIN_ORDER = ["eat","sight","stay","transit","shop"];

function svgText(cls, x, y, anchor, txt){
  return '<text class="' + cls + '" x="' + x + '" y="' + y + '" text-anchor="' + (anchor || "middle") + '">' + esc(txt) + "</text>";
}
function pinFill(k){ return PIN_FILL[k] || PIN_FILL.sight; }
function segsOf(pts, breaks){
  var out = [], start = 0, i, b;
  if(!pts || pts.length < 2) return out;
  var bs = (breaks || []).slice(); bs.push(pts.length);
  for(i = 0; i < bs.length; i++){
    b = bs[i];
    if(b - start > 1) out.push(pts.slice(start, b));
    start = b;
  }
  return out;
}
function ptsAttr(pts){
  return pts.map(function(p){ return p[0] + "," + p[1]; }).join(" ");
}
function pinHtml(p, i, pr){
  var num = (p.n === 0 || p.n) ? p.n : (i + 1);
  var r = pr || 14;
  var s = '<circle class="pin2" cx="' + p.x + '" cy="' + p.y + '" r="' + r + '" fill="' + pinFill(p.k) + '" stroke-width="' + Math.max(2, Math.round(r / 7)) + '"/>';
  s += '<text class="pn2" x="' + p.x + '" y="' + (p.y + r * 0.34) + '" text-anchor="middle" font-size="' + Math.round(r * 0.95) + '">' + esc(String(num)) + "</text>";
  return '<a href="' + esc(navUrl(p.m, p.mo)) + '" target="_blank" rel="noopener noreferrer" aria-label="导航到 ' + esc(p.l || String(num)) + '">' + s + "</a>";
}
function mapHtml(key, title){
  var M = MAPS2[key];
  if(!M) return "";
  var pins = M.pins || [];
  var h = '<div class="map2wrap">';
  if(title) h += '<div class="map2t">' + esc(title) + "</div>";
  h += '<div class="map2">';
  h += '<img src="' + M.img + '" alt="D' + esc(String(key)) + ' 路线地图" width="' + M.w + '" height="' + M.h + '">';
  h += '<svg viewBox="0 0 ' + M.w + " " + M.h + '" role="img" aria-label="路线叠层">';
  var pr = Math.max(14, Math.round(M.w / 46)), sw = Math.max(3, Math.round(M.w / 230));
  segsOf(M.drive, M.driveBreaks).forEach(function(sg){ h += '<polyline class="dr2" stroke-width="' + sw + '" points="' + ptsAttr(sg) + '"/>'; });
  segsOf(M.walk, M.walkBreaks).forEach(function(sg){ h += '<polyline class="wk2" stroke-width="' + (sw - 0.5) + '" stroke-dasharray="' + (sw * 2.4) + ' ' + (sw * 2) + '" points="' + ptsAttr(sg) + '"/>'; });
  pins.forEach(function(p, i){ h += pinHtml(p, i, pr); });
  h += "</svg></div>";

  if(pins.length){
    h += '<ol class="stops">';
    pins.forEach(function(p, i){
      var num = (p.n === 0 || p.n) ? p.n : (i + 1);
      h += "<li>";
      h += '<span class="sn" style="background:' + pinFill(p.k) + '">' + esc(String(num)) + "</span>";
      h += '<span class="sc"><span class="sname">' + esc(p.l || "") + "</span>";
      if(p.leg) h += '<span class="sleg">' + esc(p.leg) + "</span>";
      h += "</span>";
      h += '<span class="stopbtns"><a class="chip" href="' + esc(navUrl(p.m, p.mo)) + '" target="_blank" rel="noopener noreferrer">🧭</a>' +
           '<button class="chip copy" data-copy="' + esc(p.m) + '">📋</button></span>';
      h += "</li>";
    });
    h += "</ol>";
  }
  h += '<div class="mapatt">' + esc(MAPS2_ATTRIB) + "</div>";
  return h + "</div>";
}
function mapLegend(keys){
  var used = {}, i, j;
  for(i = 0; i < keys.length; i++){
    var M = MAPS2[keys[i]];
    if(!M) continue;
    (M.pins || []).forEach(function(p){ used[p.k || "sight"] = 1; });
  }
  var h = '<div class="maplg"><span><i class="w2"></i>步行</span><span><i class="d2"></i>开车</span>';
  for(j = 0; j < PIN_ORDER.length; j++){
    var k = PIN_ORDER[j];
    if(used[k]) h += '<span><b style="background:' + PIN_FILL[k] + '"></b>' + PIN_LBL[k] + "</span>";
  }
  return h + "</div>";
}

/* ---- 路线示意 ---- */
function railHtml(d){
  var keys = MAP_KEYS[d.n] || [];
  var live = [], i;
  for(i = 0; i < keys.length; i++){ if(MAPS2[keys[i]]) live.push(keys[i]); }
  if(!live.length && (!d.route || !d.route.length)) return "";

  var h = '<div class="rail">';
  if(d.route && d.route.length){
    h += '<a class="rbtn" href="' + esc(routeUrl(d.route)) + '" target="_blank" rel="noopener noreferrer">🗺 在 Google Maps 打开全天路线</a>';
  }
  if(live.length){
    h += mapLegend(live);
    for(i = 0; i < live.length; i++){
      h += mapHtml(live[i], live.length > 1 ? (["上午","下午","晚上"][i] || "") : "");
    }
    if(!(d.route && d.route.length)) return h + "</div>";
    h += '<div class="rlh">🚶 通勤一览</div>';
  }

  h += '<ul class="rl">';
  d.route.forEach(function(r, i2){
    var last = (i2 === d.route.length - 1);
    h += '<li><div class="gut"><span class="pt"></span>' + (last ? "" : '<span class="ln"></span>') + "</div>";
    h += '<div class="rc"><div class="rn">' + esc(r.n) + '</div><div class="ri">' + esc(r.m) + "</div>";
    if(r.leg) h += '<div class="rleg">' + esc(r.leg) + "</div>";
    h += "</div></li>";
  });
  h += "</ul></div>";
  return h;
}

/* ---- 厕所条 ---- */
function wcHtml(d){
  if(!d.wc || !d.wc.length) return "";
  var body = "";
  d.wc.forEach(function(k){
    var w = WC[k];
    if(!w) return;
    body += '<div class="grp"><div class="gh">' + esc(w.city) + "</div>";
    w.pay.forEach(function(p){
      body += "<div>🔢 " + esc(p[0]) + ' 密码 <span class="code">' + esc(p[1]) + "</span></div>";
    });
    if(w.free.length) body += "<div>🆓 免费：" + esc(w.free.join("、")) + "</div>";
    body += "</div>";
  });
  body += '<div class="grp"><div class="gh">通用</div><div>进任何咖啡吧买杯 1 欧咖啡就能借，天经地义。密码为 8 月实测，会失效。</div></div>';
  return '<details class="wc"><summary>🚻 附近厕所</summary><div class="wcb">' + body + "</div></details>";
}

/* ==================================================================
   四个页面

function viewToday(){
  var d = DAYS[selDay];
  var h = "";

  /* 头 */
  h += '<div class="head"><div class="head-row">';
  if(phase === "during"){
    h += '<span class="head-title">今天 · D' + DAYS[todayIdx].n + '</span><span class="head-sub">' + mdLabel(TODAY) + " " + DAYS[todayIdx].dow + " · " + esc(DAYS[todayIdx].city) + "</span>";
  }else if(phase === "before"){
    h += '<span class="head-title">还没出发</span><span class="head-sub">距 10/6 还有 ' + daysToStart + " 天</span>";
  }else{
    h += '<span class="head-title">旅程结束 🎉</span><span class="head-sub">10/18 已落地浦东</span>';
  }
  h += '<span class="sync" id="sync"><span class="dot"></span>仅本机记录</span>';
  h += "</div>";

  h += '<div class="strip">';
  DAYS.forEach(function(x, i){
    var cls = "pill" + (i === selDay ? " sel" : "") + (i === todayIdx ? " today" : "") + (firstOpen(x) < 0 ? " full" : "");
    h += '<button class="' + cls + '" data-day="' + i + '"><b>D' + x.n + "</b><span>" + mdLabel(x.date) + "</span></button>";
  });
  h += "</div></div>";

  /* 行前 / 行后横幅 */
  if(phase === "before"){
    h += '<div class="banner"><span class="bnum">' + daysToStart + '</span><span class="btxt">天后落地罗马<br>该抢的票现在就得抢</span><button data-tab="prep">去准备 →</button></div>';
  }else if(phase === "after"){
    h += '<div class="banner"><span class="bnum">🎉</span><span class="btxt">12 天走完了<br>清单留着，下次还能翻</span></div>';
  }

  /* 下一步 */
  h += '<div id="nextwrap">' + nextHtml() + "</div>";

  /* 当天信息条 */
  h += '<div class="prog"><span class="lbl">D' + d.n + " " + mdLabel(d.date) + " " + d.dow + "</span><span class=\"bar\"><i id=\"pbar\" style=\"width:0%\"></i></span><span class=\"lbl num\" id=\"pnum\">0/" + d.steps.length + "</span></div>";
  if(d.flag) h += '<div class="call"><b>今天的规矩</b>' + esc(d.flag) + "</div>";
  if(d.drive) h += '<div class="call"><b>今天要开车</b>' + esc(d.drive) + "</div>";

  /* 步骤 */
  h += '<div class="sect"><h2>当天步骤</h2><span class="rule"></span></div>';
  h += '<ul class="steps">' + d.steps.map(stepHtml).join("") + "</ul>";

  /* 路线 */
  h += '<div class="sect"><h2>当天路线</h2><span class="rule"></span></div>';
  h += railHtml(d);

  /* 厕所 + 住宿 + 备注 */
  if(d.stay){
    h += '<div class="call stay"><b>🛏 今晚住</b><span class="kk">' + esc(d.stay.t) + "</span>" + (d.stay.d ? "<br>" + esc(d.stay.d) : "");
    if(d.stay.addr) h += '<div class="stayaddr"><span>📍 地址：' + esc(d.stay.addr) + '</span><button class="chip copy" data-copy="' + esc(d.stay.addr) + '">📋 复制地址</button><a class="chip" href="' + esc(navUrl(d.stay.addr, "driving")) + '" target="_blank" rel="noopener noreferrer">🧭 导航</a></div>';
    if(d.stay.link) h += '<div class="stayaddr"><a class="chip" href="' + esc(d.stay.link.u) + '" target="_blank" rel="noopener noreferrer">🔗 ' + esc(d.stay.link.l) + '</a></div>';
    h += "</div>";
  }
  if(d.notes) d.notes.forEach(function(n){ h += '<div class="call"><b>' + esc(n.t) + "</b>" + esc(n.b) + "</div>"; });

  return h;
}

function viewPrep(){
  var total = 0, done = 0;
  PREP.forEach(function(g){ total += g.items.length; done += grpDone(g.items); });
  var h = "";
  h += '<div class="head"><div class="head-row"><span class="head-title">出发前要办的事</span><span class="head-sub num">' + done + "/" + total + '</span><span class="sync" id="sync"><span class="dot"></span>仅本机记录</span></div><div style="height:10px"></div></div>';
  PREP.forEach(function(g){
    h += '<div class="grp"><div class="gtitle"><span class="gwhen">' + esc(g.when) + '</span><span class="gc num" data-gc="' + esc(g.when) + '">' + grpDone(g.items) + "/" + g.items.length + "</span></div>";
    var lastCat = null;
    h += '<ul class="steps">';
    g.items.forEach(function(it){
      if(it.cat && it.cat !== lastCat){
        h += '</ul><div class="pcat">' + esc(it.cat) + '</div><ul class="steps">';
        lastCat = it.cat;
      }
      var s = { id:it.id, t:"", e:"", a:it.a, sub:it.d, link:it.link };
      h += stepHtml(s);
    });
    h += "</ul>";
    if(g.note) h += '<div class="call"><b>提醒</b>' + esc(g.note) + "</div>";
    h += "</div>";
  });
  h += '<div class="foot">全部内容来自《意大利 12 天行程 · 详版清单》。打勾在三台手机之间共享。</div>';
  return h;
}

function refreshMarks(){
  var nodes = document.querySelectorAll("[data-step]");
  for(var i = 0; i < nodes.length; i++){
    var el = nodes[i];
    var st = STATE[el.getAttribute("data-step")];
    el.classList.toggle("is-done", st === "done");
    el.classList.toggle("is-skip", st === "skipped");
    var btn = el.querySelector(".check");
    if(btn) btn.setAttribute("aria-checked", st === "done" ? "true" : "false");
  }

  if(tab === "today"){
    var wrap = document.getElementById("nextwrap");
    if(wrap){
      var d = DAYS[selDay];
      var i2 = firstOpen(d);
      var nid = i2 < 0 ? "__done__" : d.steps[i2].id;
      if(nid !== lastNextId){
        wrap.innerHTML = nextHtml();
        var card = wrap.firstChild;
        if(card && card.classList && lastNextId !== null) card.classList.add("anim");
        lastNextId = nid;
      }
    }
    var d3 = DAYS[selDay], n3 = dayDone(d3);
    var bar = document.getElementById("pbar"), pn = document.getElementById("pnum");
    if(bar) bar.style.width = Math.round(n3 / d3.steps.length * 100) + "%";
    if(pn) pn.textContent = n3 + "/" + d3.steps.length;
    var pills = document.querySelectorAll(".pill[data-day]");
    for(var k = 0; k < pills.length; k++){
      var idx = +pills[k].getAttribute("data-day");
      pills[k].classList.toggle("full", firstOpen(DAYS[idx]) < 0);
    }
  }

  var badge = document.getElementById("prepbadge");
  if(badge){
    var tot = 0, dn = 0;
    PREP.forEach(function(g){ tot += g.items.length; dn += grpDone(g.items); });
    if(dn >= tot){ badge.style.display = "none"; }
    else { badge.style.display = "flex"; badge.textContent = (tot - dn); }
  }
}

/* ============ 渲染 ============ */

function dvRow(k, v){
  if(!v) return "";
  return '<div class="dv-r"><span class="dv-k">' + esc(k) + '</span><span class="dv-v">' + esc(v) + "</span></div>";
}

function dvList(arr, cls){
  var h = '<ul class="dv-list' + (cls ? " " + cls : "") + '">';
  arr.forEach(function(s){ h += "<li>" + esc(s) + "</li>"; });
  return h + "</ul>";
}

function dvTodo(){
  return '<div class="dv-todo">（待补）</div>';
}

function dvBlk(icon, title, body, open){
  return '<details class="dv-blk"' + (open ? " open" : "") +
    '><summary><span class="dv-bi">' + icon + "</span>" + esc(title) +
    '</summary><div class="dv-body">' + body + "</div></details>";
}

function dvCar(){
  var gs = (DRIVE.car && DRIVE.car.groups) ? DRIVE.car.groups : [];
  if(!gs.length) return dvTodo();
  var h = "";
  gs.forEach(function(g){
    h += '<div class="dv-g"><div class="dv-gt">' + esc(g.t) + "</div>" + dvList(g.rows) + "</div>";
  });
  return h;
}

function dvLegF(emo, v){
  if(!v) return "";
  return '<div class="dv-legf"><span class="dv-fe">' + emo + "</span><span>" + esc(v) + "</span></div>";
}

function dvLegs(){
  if(!DRIVE.legs.length) return dvTodo();
  var h = "";
  DRIVE.legs.forEach(function(g){
    var big = (g.km ? g.km + " km" : "") + (g.km && g.min ? " · " : "") + (g.min || "");
    h += '<div class="dv-leg"><div class="dv-leghd">' +
         '<span class="dv-legd">' + esc(g.d) + "</span>" +
         "<b>" + esc(g.from) + " → " + esc(g.to) + "</b></div>";
    h += big ? '<div class="dv-legbig">' + esc(big) + "</div>" : '<div class="dv-todo">（待补）</div>';
    h += dvLegF("🛣", g.road);
    h += dvLegF("💶", g.toll);
    h += dvLegF("🅿️", g.park);
    h += dvLegF("🚡", g.lift);
    h += dvLegF("⛔", g.ztl);
    h += dvLegF("🏠", g.host);
    h += "</div>";
  });
  return h;
}

function dvZtl(){
  var z = DRIVE.ztl;
  var h = '<div class="dv-what">' + esc(z.what) + "</div>";
  h += '<div class="dv-cam">' + z.cam + "<span>白底红圈＋ZTL 字样＝限行区起点。门架上的电子屏写 VARCO ATTIVO 就是在抓拍。</span></div>";
  h += '<div class="dv-g"><div class="dv-gt">导航怎么设</div>' + dvList(z.nav) + "</div>";
  h += '<div class="dv-g"><div class="dv-gt">罚单怎么来</div>' + dvList(z.fine, "warn") + "</div>";
  return h;
}

function dvRules(){
  var h = "";
  DRIVE.rules.forEach(function(g){
    h += '<div class="dv-g"><div class="dv-gt">' + esc(g.t) + '</div><div class="dv-tbl">';
    g.rows.forEach(function(r){ h += dvRow(r[0], r[1]); });
    h += "</div>";
    if(g.n) h += '<div class="dv-n">' + esc(g.n) + "</div>";
    h += "</div>";
  });
  return h;
}

function dvSigns(){
  var h = '<div class="dv-grid">';
  DRIVE.signs.forEach(function(s){
    h += '<div class="dv-sign">' + s.svg +
         '<span class="dv-l">' + esc(s.l) + "</span>" +
         '<span class="dv-d">' + esc(s.d) + "</span></div>";
  });
  return h + "</div>";
}

function dvMountain(){
  if(!DRIVE.mountain.length) return dvTodo();
  var h = "";
  DRIVE.mountain.forEach(function(m){
    h += '<div class="dv-mt"><b>' + esc(m.t) + "</b><span>" + esc(m.d) + "</span></div>";
  });
  if(DRIVE.mkey) h += '<div class="dv-mkey">🧭 ' + esc(DRIVE.mkey) + "</div>";
  return h;
}

function dvSos(){
  var G = DRIVE.sosGuide || {}, h = "";
  if(G.first && G.first.length){
    h += '<div class="dv-case first"><b>先打谁</b><ol>';
    G.first.forEach(function(s){ h += "<li>" + esc(s) + "</li>"; });
    h += "</ol></div>";
  }
  (G.cases || []).forEach(function(c){
    h += '<div class="dv-case"><b>' + esc(c.t) + "</b><ol>";
    c.steps.forEach(function(s){ h += "<li>" + esc(s) + "</li>"; });
    h += "</ol></div>";
  });
  if(G.say && G.say.length){
    h += '<div class="dv-say"><b>电话里怎么说（英语）</b>';
    G.say.forEach(function(p){ h += "<div>" + esc(p[0]) + "<i>" + esc(p[1]) + "</i></div>"; });
    h += "</div>";
  }
  if(G.words && G.words.length){
    h += '<div class="dv-say"><b>路牌和单据上会看到的词</b>';
    G.words.forEach(function(p){ h += "<div>" + esc(p[0]) + "<i>" + esc(p[1]) + "</i></div>"; });
    h += "</div>";
  }
  h += '<div class="dv-sos">';
  DRIVE.sos.forEach(function(s){
    h += '<div class="dv-sosr"><span class="dv-sost"><span class="dv-sosn">' + esc(s.l) +
         '</span><span class="dv-sosd">' + esc(s.d) + "</span></span>";
    if(s.tel) h += '<a class="dv-tel" href="tel:' + esc(s.tel) + '">📞 拨号</a>';
    h += "</div>";
  });
  return h + "</div>";
}

function viewDrive(){
  var h = "";
  h += '<div class="head"><div class="head-row"><span class="head-title">开车</span>' +
       '<span class="head-sub">罗马 → 米兰</span></div><div style="height:10px"></div></div>';

  h += '<div class="dv-sum"><div class="dv-eye">出发前 5 句话</div><ol>';
  DRIVE.summary.forEach(function(s){ h += "<li>" + esc(s) + "</li>"; });
  h += "</ol></div>";

  h += dvBlk("🚙", "选车与取还车", dvCar());
  h += dvBlk("🛣", "每段路", dvLegs());
  h += dvBlk("🚫", "ZTL 怎么躲", dvZtl(), true);
  h += dvBlk("📋", "路上常识", dvRules());
  h += dvBlk("🪧", "标志图鉴", dvSigns());
  h += dvBlk("⛰", "山路段", dvMountain());
  h += dvBlk("🆘", "出事怎么办", dvSos());

  h += '<div class="foot">规则与标志来自《意大利自驾规则与标志 · 事实核查报告》。费用、时段各城各年不同，到场以路牌为准。</div>';
  return h;
}

var TABS = [
  { k:"today", e:"📍", l:"今天" },
  { k:"all",   e:"🗓", l:"全程" },
  { k:"drive", e:"🚗", l:"开车" },
  { k:"prep",  e:"✅", l:"准备" },
  { k:"pack",  e:"🎒", l:"行囊" }
];

function renderTabbar(){
  var h = "";
  TABS.forEach(function(t){
    h += '<button data-tab="' + t.k + '" class="' + (tab === t.k ? "on" : "") + '"><span class="ti">' + t.e + "</span>" + t.l;
    if(t.k === "prep") h += '<span class="badge" id="prepbadge">0</span>';
    h += "</button>";
  });
  document.getElementById("tabbar").innerHTML = h;
}

function render(scrollTop){
  var v = document.getElementById("view");
  lastNextId = null;
  if(tab === "today") v.innerHTML = viewToday();
  else if(tab === "all") v.innerHTML = viewAll();
  else if(tab === "drive") v.innerHTML = (typeof viewDrive === "function") ? viewDrive() : '<div class="card">开车指南加载中</div>';
  else if(tab === "prep") v.innerHTML = viewPrep();
  else v.innerHTML = viewPack();
  renderTabbar();
  setSync(dbLive);
  refreshMarks();
  if(scrollTop !== false) window.scrollTo(0, 0);
  if(tab === "today"){
    var sel = document.querySelector(".pill.sel");
    if(sel && sel.scrollIntoView){
      try{ sel.scrollIntoView({block:"nearest", inline:"center"}); }catch(e){}
    }
  }
}

document.addEventListener("click", function(ev){
  var t = ev.target;
  while(t && t !== document.body){
    if(t.tagName && String(t.tagName).toUpperCase() === "A") return;
    if(t.hasAttribute && t.hasAttribute("data-copy")){
      copyText(t.getAttribute("data-copy"));
      return;
    }
    if(t.hasAttribute && t.hasAttribute("data-undo")){
      var uid = t.getAttribute("data-undo");
      setStep(uid, null);
      closeCele();
      toast("已撤回");
      scrollToStep(uid);
      return;
    }
    if(t.hasAttribute && t.hasAttribute("data-cele-next")){
      closeCele();
      if(selDay < DAYS.length - 1){ selDay += 1; render(); }
      return;
    }
    if(t.hasAttribute && t.hasAttribute("data-cele-close")){
      closeCele();
      return;
    }
    if(t.hasAttribute && t.hasAttribute("data-toggle")){
      var id = t.getAttribute("data-toggle");
      var wasDone = STATE[id] === "done";
      var d0 = (tab === "today") ? DAYS[selDay] : null;
      var openBefore = d0 ? firstOpen(d0) : -2;
      var fromList = inList(t);
      setStep(id, wasDone ? null : "done");
      if(wasDone){ toast("已改回未完成"); return; }
      var so = findStep(id);
      var label = so ? so.a : "";
      if(label.length > 22) label = label.slice(0, 22) + "…";
      toastUndo("已完成：" + label, id);
      if(d0){
        var nowOpen = firstOpen(d0);
        if(openBefore >= 0 && nowOpen < 0){
          setTimeout(function(){ celebrate(d0); }, 250);
        }else if(nowOpen >= 0){
          if(fromList){ scrollToStep(d0.steps[nowOpen].id); }
          else{
            var w = document.getElementById("nextwrap");
            if(w){ try{ w.scrollIntoView({behavior:"smooth", block:"start"}); }catch(e){} }
          }
        }
      }
      return;
    }
    if(t.hasAttribute && t.hasAttribute("data-skip")){
      var id2 = t.getAttribute("data-skip");
      setStep(id2, STATE[id2] === "skipped" ? null : "skipped");
      return;
    }
    if(t.hasAttribute && t.hasAttribute("data-day")){
      selDay = +t.getAttribute("data-day");
      render(false);
      return;
    }
    if(t.hasAttribute && t.hasAttribute("data-goto")){
      selDay = +t.getAttribute("data-goto");
      tab = "today";
      render();
      return;
    }
    if(t.hasAttribute && t.hasAttribute("data-tab")){
      tab = t.getAttribute("data-tab");
      render();
      return;
    }
    t = t.parentNode;
  }
}, false);

loadLocal();
render();
if(SB_URL){ sbStart(); } else { initDb(); }
</script>

</body></html>
